apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Chart.Name }}-pv"
  labels:
    app: "{{ .Chart.Name }}-pv"
spec:
  storageClassName: nfs
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.path }}
    readOnly: false
