apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: archivebox
        image: "{{ .Values.image }}:{{ .Values.version }}"
        env:
        - name: PUBLIC_INDEX
          value: "False"
        - name: PUBLIC_SNAPSHOTS
          value: "False"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SAVE_ARCHIVE_DOT_ORG
          value: "False"
        - name: SAVE_SCREENSHOT
          value: "False"
        - name: SAVE_DOM
          value: "False"
        - name: SAVE_SINGLEFILE
          value: "False"

        volumeMounts:
        - mountPath: "/data"
          name: "{{ .Chart.Name }}-volume"
          subPath: data
      volumes:
        - name: "{{ .Chart.Name }}-volume"
          persistentVolumeClaim:
            claimName: "{{ .Chart.Name }}-pvc"
