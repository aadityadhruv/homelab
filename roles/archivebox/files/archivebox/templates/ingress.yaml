apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archivebox
  annotations:
    cert-manager.io/cluster-issuer: "ca-issuer"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - archive.home
    secretName: archivebox-tls
  rules:
  - host: archive.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: archivebox-service
            port:
              number: 80
