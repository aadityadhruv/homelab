apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
spec:
  type: LoadBalancer
  selector:
    app: {{ .Chart.Name }}
  ports:
    - protocol: TCP
      targetPort: 23231
      port: 22
      name: ssh
    - protocol: TCP
      port: 81
      targetPort: 23232
      name: http
    - protocol: TCP
      port: {{ .Values.port }}
      targetPort: 80
      name: webui
