apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: dufs
        image: "{{ .Values.image }}:{{ .Values.version }}"
        ports:
          - name: http
            containerPort: 80
        env:
          - name: "DUFS_CONFIG"
            value: "/etc/dufs.yaml"
        volumeMounts:
        - mountPath: "/Drive"
          name: "{{ .Chart.Name }}-volume"
          subPath: "Drive"
        - mountPath: "/etc/dufs.yaml"
          name: "config"
          subPath: dufs
        - mountPath: "/database.db"
          name: "{{ .Chart.Name }}-volume"
          subPath: "db/database.db"
        - mountPath: "/.filebrowser.json"
          name: "{{ .Chart.Name }}-volume"
          subPath: "config/filebrowser.json"
      volumes:
      - name: "config"
        configMap:
          name: "{{ .Chart.Name }}-config"
      - name: "{{ .Chart.Name }}-volume"
        persistentVolumeClaim:
          claimName: {{ .Chart.Name }}-pvc 
#      securityContext:
#        runAsUser: 1001
#        runAsGroup: 1001
#        fsGroup: 1001
