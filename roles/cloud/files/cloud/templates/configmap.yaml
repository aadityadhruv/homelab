apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
data:
  dufs: |
    serve-path: '/Drive'
    bind: 0.0.0.0
    port: 80
    hidden:
      - .Trash*
      - .stfolder
    auth:
      - {{ .Values.user }}:{{ .Values.password }}@/:rw
    allow-all: false
    allow-upload: true
    allow-delete: true
    allow-search: true
    allow-symlink: true
    allow-archive: true
    enable-cors: true
    render-index: true
    render-try-index: true
    render-spa: true
    log-file: /dufs.log
