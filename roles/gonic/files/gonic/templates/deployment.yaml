apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: gonic
        image: "{{ .Values.image }}:{{ .Values.version }}"
        volumeMounts:
        - mountPath: "/data"
          name: "{{ .Chart.Name }}-volume"
          subPath: data
        - mountPath: "/music"
          name: "{{ .Chart.Name }}-volume"
          subPath: music
        - mountPath: "/playlists"
          name: "{{ .Chart.Name }}-volume"
          subPath: playlists
      volumes:
        - name: "{{ .Chart.Name }}-volume"
          persistentVolumeClaim:
            claimName: "{{ .Chart.Name }}-pvc"
