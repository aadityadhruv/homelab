apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gonic
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - music.aadityadhruv.com
    - music.home
    secretName: gonic-tls
  rules:
  - host: music.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gonic-service
            port:
              number: 80
  - host: music.aadityadhruv.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gonic-service
            port:
              number: 80
