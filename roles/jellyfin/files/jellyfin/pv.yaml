---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
  labels:
    app: jellyfin-config
spec:
  storageClassName: nfs
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.20.5
    path: /mnt/nfs/k3s/jellyfin/config
    readOnly: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-data
  labels:
    app: jellyfin-data
spec:
  storageClassName: nfs
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.20.5
    path: /mnt/nfs/k3s/jellyfin/data
    readOnly: false
