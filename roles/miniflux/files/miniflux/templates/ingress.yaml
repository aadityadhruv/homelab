apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux 
  annotations:
    cert-manager.io/cluster-issuer: "ca-issuer"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - news.aadityadhruv.com
    - news.home
    secretName: miniflux-tls
  rules:
  - host: news.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miniflux-service
            port:
              number: 80
  - host: news.aadityadhruv.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miniflux-service
            port:
              number: 80
