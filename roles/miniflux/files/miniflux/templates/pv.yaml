apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Chart.Name }}-pv"
  labels:
    app: "{{ .Chart.Name }}-pv"
spec:
  storageClassName: local-storage
  local:
    path: {{ .Values.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - regice
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
