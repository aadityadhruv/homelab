apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-postgres-deployment"
  labels:
    app: "{{ .Release.Name }}-db"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-db"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-db"
    spec:
      containers:
      - name: {{ .Release.Name }}-db
        image: "{{ .Values.image }}:{{ .Values.version }}"
        env: 
        - name: POSTGRES_USER
          value: {{ .Values.user }}
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_PASSWORD
          value: {{ .Values.password }}
        - name: PGDATA
          value: /var/lib/postgresql/data/_data
        ports:
          - containerPort: 5432
        volumeMounts:
        - mountPath: "/var/lib/postgresql/data"
          name: "{{ .Release.Name }}-database-volume"
      volumes:
        - name: "{{ .Release.Name }}-database-volume"
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-db-pvc"
