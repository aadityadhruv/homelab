apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-db-pv"
  labels:
    app: "{{ .Release.Name }}-db-pv"
spec:
  storageClassName: local-storage
  local:
    path: {{ .Values.path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - regice
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
