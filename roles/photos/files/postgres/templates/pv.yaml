apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-db-pv"
  labels:
    app: "{{ .Release.Name }}-db-pv"
spec:
  storageClassName: nfs
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: {{ .Values.nfs.server }}
    path:  {{ .Values.nfs.path }}
    readOnly: false
