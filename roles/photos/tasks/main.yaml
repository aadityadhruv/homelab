- name: Deploy Immich Postgres Chart
  kubernetes.core.helm:
    state: "{%- if immich.enabled -%} present {%- else -%} absent {%- endif -%}"
    name: immich-postgres
    release_name: immich-postgres
    chart_ref: "{{ lookup('env', 'PWD') }}/roles/photos/files/postgres"
    values:
      image: "{{ immich.postgres.image }}"
      version: "{{ immich.postgres.version }}"
      user: "{{ immich.postgres.user }}"
      password: "{{ immich.postgres.password }}"
      path: "{{ immich.postgres.path }}"
    namespace: default
  delegate_to: localhost
  run_once: true

- name: Deploy Immich Core
  kubernetes.core.helm:
    state: "{%- if immich.enabled -%} present {%- else -%} absent {%- endif -%}"
    name: immich-core
    chart_ref: "{{ lookup('env', 'PWD') }}/roles/photos/files/core"
    values:
      nfs:
        server: "{{ nfs.server }}"
        path: "{{ nfs.path }}"
    namespace: default
  delegate_to: localhost
  run_once: true


- name: Deploy Immich
  kubernetes.core.helm:
    state: "{%- if immich.enabled -%} present {%- else -%} absent {%- endif -%}"
    name: immich-prod
    chart_ref: oci://ghcr.io/immich-app/immich-charts/immich
    values:
      controllers:
        main:
          containers:
            main:
              image:
                tag: "{{ immich.version }}"
              env:
                DB_USERNAME: "{{ immich.postgres.user }}"
                DB_PASSWORD: "{{ immich.postgres.password }}"
                DB_DATABASE_NAME: immich
                DB_HOSTNAME: immich-postgres-db-service
      immich:
        persistence:
          library:
            existingClaim: "immich-core-pvc"
      valkey:
        enabled: true
    namespace: default
  delegate_to: localhost
  run_once: true
