apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: pihole
        image: "{{ .Values.image }}:{{ .Values.version }}"
        ports:
        - containerPort: 53
          protocol: TCP
        - containerPort: 53
          protocol: UDP
        - containerPort: 80
          protocol: TCP
        volumeMounts:
        - mountPath: "/etc/pihole"
          name: "{{ .Chart.Name }}-volume"
          subPath: "pihole"
        - mountPath: "/etc/dnsmasq.d"
          name: "{{ .Chart.Name }}-volume"
          subPath: "dnsmasq"
      volumes:
        - name: "{{ .Chart.Name }}-volume"
          persistentVolumeClaim:
            claimName: "{{ .Chart.Name }}-pvc"
