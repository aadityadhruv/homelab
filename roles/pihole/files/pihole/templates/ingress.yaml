---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prefix-admin-pihole
  namespace: default
spec:
  redirectRegex:
    regex: "^https?://dns.home/$"
    replacement: "https://dns.home/admin"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  annotations:
    cert-manager.io/cluster-issuer: "ca-issuer"
    traefik.ingress.kubernetes.io/router.middlewares: default-prefix-admin-pihole@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - dns.aadityadhruv.com
    - dns.home
    secretName: pihole-tls
  rules:
  - host: dns.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole-service
            port:
              number: 80
  - host: dns.aadityadhruv.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole-service
            port:
              number: 80
