apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: website
        image: "{{ .Values.image }}:{{ .Values.version }}"
        volumeMounts:
        - mountPath: "/etc/caddy/Caddyfile"
          name: "config"
          subPath: "Caddyfile"
        - mountPath: "/static"
          name: "{{ .Chart.Name }}-volume"
          subPath: "static"
      volumes:
      - name: "config"
        configMap:
          name: "{{ .Chart.Name }}-config"
      - name: "{{ .Chart.Name }}-volume"
        persistentVolumeClaim:
          claimName: {{ .Chart.Name }}-pvc 
